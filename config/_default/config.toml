# Configuration of Academia
# Documentation: https://sourcethemes.com/academic/
#
# This file is formatted using TOML syntax - learn more at https://learnxinyminutes.com/docs/toml/
# Each configuration section is defined by a name in square brackets (e.g. `[outputs]`).

# Title of your site
title = "Mark Riganti's Projects"

# The URL of your site.
# End your URL with a `/` trailing slash, e.g. `https://example.com/`.
baseURL = "https://riganti.com.au/"

# Enter a copyright notice to display in the site footer.
# To display a copyright symbol, type `&copy;`. For current year, type `{year}`.
copyright = " Mark Riganti `{year}`"

# Enable analytics by entering your Google Analytics tracking ID
googleAnalytics = "UA-158796585-1"

enableRobotsTXT = true
canonifyURLs = true

# Enable comments by entering your Disqus shortname
disqusShortname = ""

############################
## Advanced options below ##
############################

# Name of Academia theme folder in `themes/`.
theme = "academia-hugo"

# Get last modified date for content from Git?
enableGitInfo = false

# Default language to use (if you setup multilingual support)
defaultContentLanguage = "en"
hasCJKLanguage = false  # Set `true` for Chinese/Japanese/Korean languages.
defaultContentLanguageInSubdir = false
removePathAccents = true  # Workaround for https://github.com/gohugoio/hugo/issues/5687

# `paginate` was replaced by [pagination].pagerSize in Hugo 0.128. The old key is now
# ignored silently, which drops list pages to Hugo's default of 10 items per page.
enableEmoji = true
footnotereturnlinkcontents = "<sup>^</sup>"
ignoreFiles = ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]

[pagination]
  pagerSize = 20  # Number of items per page in paginated lists.

[outputs]
  home = [ "HTML", "RSS", "JSON" ]
  section = [ "HTML", "RSS" ]

# Configure BlackFriday Markdown rendering.
#   See: https://gohugo.io/getting-started/configuration/#configure-blackfriday
[blackfriday]
  hrefTargetBlank = false  # `true` opens external links in a new tab. See https://github.com/gohugoio/hugo/issues/2424
	angledQuotes = false
	latexDashes = false
  extensions = ["backslashLineBreak"]

[imaging]
  resampleFilter = "lanczos"
  quality = 95
  anchor = "Center"  # Anchor for cropping. Options include Smart and Center.

# Taxonomies.
[taxonomies]
  tag = "tags"
  category = "categories"
  publication_type = "publication_types"
  author = "authors"


[params]
	#optional use as main title instead of title field
	maintitle = "Code >> Cad >> Carve >> Create"
	# Decorative fading slash trail after the wordmark; 0 disables it.
	brand_trail = 0
	# Character the trail is drawn with; matches the separator in maintitle.
	brand_trail_char = ">"
	#description for google summary
	sitedescription = "Mark Riganti's Project Website. A Collection of CAD, Coding, Woodwork and Electronics Projects. CODE, CAD, CARVE, CREATE"
